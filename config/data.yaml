ssb_export_price:
  table_id: "03024"
  api_url: "https://data.ssb.no/api/v0/en/table/03024"
  commodity_code: "01" # Fish-farm bred salmon, fresh or chilled
  contents_code: "Kilopris" # Price per kilo (NOK)
  start_week: null # e.g. "2015U01"; null = full available history
  end_week: null # null = latest available week
  raw_path: "data/raw/ssb_export_price_raw.json"
  processed_path: "data/processed/ssb_weekly_export_price.parquet"

sea_surface_temp:
  # NOAA OISST v2.1 daily anomaly, via NCEI's ERDDAP mirror. This mirror only
  # keeps a rolling ~6.5 year window (verified 2026-08-03: starts 2020-02-28),
  # not the full 1981-present archive - see CLAUDE.md "Deferred items".
  das_url: "https://www.ncei.noaa.gov/erddap/griddap/ncdc_oisst_v2_avhrr_by_time_zlev_lat_lon.das"
  csv_url: "https://www.ncei.noaa.gov/erddap/griddap/ncdc_oisst_v2_avhrr_by_time_zlev_lat_lon.csv"
  variable: "anom" # Daily sea surface temperature anomaly (Celsius)
  # Points spanning the main salmon-farming belt, verified clear of the land
  # mask (0.25 degree grid). Longitude is 0-360 but Norway's ~5-14E needs no
  # conversion (already eastern hemisphere).
  points:
    - name: "rogaland"
      lat: 59.125
      lon: 5.125
    - name: "vestland"
      lat: 60.625
      lon: 4.625
    - name: "more_og_romsdal"
      lat: 62.625
      lon: 6.125
    - name: "trondelag"
      lat: 64.625
      lon: 9.625
    - name: "nordland"
      lat: 67.125
      lon: 13.625
  raw_dir: "data/raw/sea_surface_temp"
  processed_path: "data/processed/sea_surface_temp_anomaly_weekly.parquet"

feed_cost_fishmeal:
  # IndexMundi has no dedicated CSV/API export (verified 2026-08-03: every
  # format/type/export query param just returns the same HTML page) - the
  # price history is embedded as an HTML table (id="gvPrices"), so we parse
  # that directly. There is no "fish-oil" commodity on IndexMundi at all
  # (only fish-meal and fish/salmon) - see CLAUDE.md "Deferred items".
  page_url: "https://www.indexmundi.com/commodities/"
  commodity: "fish-meal"
  months: 360 # IndexMundi's server-side max (~30yr); anything higher silently breaks
  raw_path: "data/raw/indexmundi_fish_meal_raw.html"
  processed_path: "data/processed/fishmeal_price_monthly.parquet"

daily_market_data:
  # Daily FX + Oslo Bors salmon-stock data for the daily nowcast layer
  # (CLAUDE.md architecture item 1). Fish Pool/Euronext salmon futures
  # data was investigated and deferred 2026-09-04 - no free historical
  # source exists (see CLAUDE.md "Deferred items") - so only FX + stocks
  # feed the nowcast, not a futures curve.
  # All 7 series verified via yfinance 2026-09-04; BAKKA.OL has the
  # shortest history (starts 2010-03-26), which bounds how far back the
  # nowcast backtest can run.
  fx_pairs:
    - ticker: "USDNOK=X"
      column: "usdnok"
    - ticker: "EURNOK=X"
      column: "eurnok"
  stock_tickers:
    - ticker: "MOWI.OL"
      column: "mowi"
    - ticker: "SALM.OL"
      column: "salm"
    - ticker: "LSG.OL"
      column: "lsg"
    - ticker: "GSF.OL"
      column: "gsf"
    - ticker: "BAKKA.OL"
      column: "bakka"
  period: "max" # yfinance history period - fetch full available range
  raw_dir: "data/raw/daily_market_data"
  processed_path: "data/processed/daily_market_data.parquet"
